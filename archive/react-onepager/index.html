    <script>
      /* Analytics-prep shim — loads nothing, sends nothing.
         Cuando se conecte GA4/GTM/Plausible, se lee window.__ev sin tocar el markup. */
      window.__ev = window.__ev || [];
      document.addEventListener('click', function (e) {
        var t = e.target instanceof Element ? e.target.closest('[data-ev]') : null;
        if (!t) return;
        window.__ev.push({
          ev: t.getAttribute('data-ev'),
          loc: t.getAttribute('data-ev-loc') || '',
          t: Date.now(),
        });
      });
    </script>
